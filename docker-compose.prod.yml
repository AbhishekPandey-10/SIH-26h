services:
  # ============================================================================
  # MediKiosk Backend (FastAPI + LangGraph Production)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend-prod
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/medikiosk
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@postgres:5432/medikiosk
      - USE_SQLITE_FALLBACK=true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # MediKiosk Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MediKiosk Frontend (Nginx Production Reverse Proxy & Static Hosting)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: medikiosk-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
    driver: local
