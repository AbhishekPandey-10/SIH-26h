services:
  # ============================================================================
  # MediKiosk Backend (FastAPI + LangGraph + Uvicorn with hot-reload)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/medikiosk
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@postgres:5432/medikiosk
      - USE_SQLITE_FALLBACK=false
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # MediKiosk Database (PostgreSQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MediKiosk Frontend (React + Vite PWA with hot-reload)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medikiosk-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
